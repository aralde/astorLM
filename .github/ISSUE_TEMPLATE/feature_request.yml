name: Feature request
description: Propose a new capability or an API change.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        `astorlm` is SDK-first and deliberately has no CLI or TUI. Proposals that
        add a binary are out of scope — build it on top of the library instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the use case, not the solution. What are you building, and
        where does the library get in your way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch how it would look from a consumer's point of view.
      render: typescript

  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: >
        Hooks, a custom `Executor`, a custom `SkillSource`, a wrapper tool — the
        library is designed to be extended from the outside, so tell us which of
        those you tried and why they were not enough.

  - type: dropdown
    id: stability
    attributes:
      label: Where would this live?
      options:
        - Core (runtime-agnostic, no Node imports)
        - Node runner (astorlm/core)
        - Built-in tools
        - A new astorlm/experimental/* subpath
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am willing to open a pull request for this.
          required: false
