<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="astorlm">
  <title>astorlm</title>
  <defs>
    <linearGradient id="am-bellows" x1="6" y1="102" x2="122" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E1B3A"/>
      <stop offset="0.52" stop-color="#C6452F"/>
      <stop offset="1" stop-color="#E8A33D"/>
    </linearGradient>
  </defs>

  <!-- left end plate -->
  <rect x="6" y="26" width="24" height="76" rx="7" fill="url(#am-bellows)"/>
  <!-- right end plate -->
  <rect x="98" y="26" width="24" height="76" rx="7" fill="url(#am-bellows)"/>

  <!-- bellows: pleated band between both plates -->
  <path d="M30 30 L47 42 L64 30 L81 42 L98 30 L98 98 L81 86 L64 98 L47 86 L30 98 Z"
        fill="url(#am-bellows)"/>

  <!-- fold lines, punched through the band -->
  <g stroke="#2B0A14" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round">
    <path d="M47 44 V84"/>
    <path d="M64 33 V95"/>
    <path d="M81 44 V84"/>
  </g>

  <!-- keyboard buttons -->
  <g fill="#2B0A14" fill-opacity="0.5">
    <circle cx="18" cy="44" r="3.4"/>
    <circle cx="18" cy="64" r="3.4"/>
    <circle cx="18" cy="84" r="3.4"/>
    <circle cx="110" cy="44" r="3.4"/>
    <circle cx="110" cy="64" r="3.4"/>
    <circle cx="110" cy="84" r="3.4"/>
  </g>
</svg>
